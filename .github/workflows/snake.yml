name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2567cc&color_dots=#e9eef5,#bcd3f2,#7fa9e6,#4a84d9,#2567cc
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#69a2ff&color_dots=#0d213d,#1b3a66,#275fb6,#69a2ff,#6ee7f2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
